[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# `cargo run` flashes and opens the serial monitor.
runner = "espflash flash --monitor --flash-size 16mb --partition-table partitions.csv"
rustflags = [
    # esp-hal's linker script.
    "-C", "link-arg=-Tlinkall.x",
    "-C", "force-frame-pointers",
]

[unstable]
build-std = ["core", "alloc"]

[env]
# esp-hal's cache setup at startup. The data cache is 32 KB with 32-byte lines by default; the
# linker script already leaves the other 32 KB of its block free, so 64 KB costs no RAM.
ESP_HAL_CONFIG_DATA_CACHE_SIZE = "64KB"
ESP_HAL_CONFIG_DATA_CACHE_LINE_SIZE = "64B"
