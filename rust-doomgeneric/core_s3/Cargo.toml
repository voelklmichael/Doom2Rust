[package]
name = "core_s3"
authors = ["michaelvoelkl@zoho.com"]
version = "0.0.0"
publish = false
edition = "2021"

# Standalone workspace: this crate targets xtensa-esp32s3-none-elf and needs the
# `esp` toolchain (see PLAN.md), so it must stay out of the host workspace
# (`cargo build --workspace` on the host would otherwise try to build it).
[workspace]

[[bin]]
name = "core_s3"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# `core-s3` is the CoreS3 board support crate (I2C/PMU/LCD bring-up, UI widgets), taken
# from git at the tag the display_widgets example was verified against. The other
# versions are the ones core-s3 v0.5.0 pins in its workspace; esp-hal is a `links` crate,
# so they must match core-s3's exactly or the build fails with duplicate-crate errors.
core-s3 = { git = "https://github.com/anapeksha/core-s3-rs", tag = "v0.5.0", features = ["esp-hal"] }
esp-alloc = { version = "=0.10.0", features = ["esp32s3"] }
embedded-graphics = { version = "0.8.2", default-features = false }
esp-backtrace = { version = "=0.17.0", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false, features = ["esp32s3"] }
esp-hal = { version = "=1.1.2", default-features = false, features = ["esp32s3", "rt", "unstable"] }
esp-println = { version = "=0.15.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
heapless = { version = "0.9.3", default-features = false }
rust_doomgeneric = { path = "../engine" }
core_s3_protocol = { path = "../core_s3_protocol" }
# Wi-Fi input. esp-radio needs the esp-rtos scheduler underneath, and embassy-net for TCP.
esp-radio = { version = "=1.0.0-beta.0", default-features = false, features = ["esp32s3", "wifi", "unstable", "esp-alloc"] }
esp-rtos = { version = "=0.3.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
embassy-executor = { version = "0.10", default-features = false }
embassy-net = { version = "0.9", default-features = false, features = ["tcp", "dhcpv4", "medium-ethernet"] }
embassy-sync = "0.8"
embassy-time = "0.5"
static_cell = "2.1"

[profile.dev]
# Debug builds are too slow (and too big) to be useful on the device.
opt-level = "s"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
