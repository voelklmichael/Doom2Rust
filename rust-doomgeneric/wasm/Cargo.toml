[package]
name = "doomgeneric_wasm"
authors = ["michaelvoelkl@zoho.com"]
version = "0.0.0"
publish = false
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust_doomgeneric = { path = "../engine" }
# The version has to match the `wasm-bindgen` command line tool that build.sh runs.
wasm-bindgen = "=0.2.121"
