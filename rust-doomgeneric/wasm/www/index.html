<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOOM</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --fg: #ddd;
      --dim: #888;
      --accent: #c33;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box; }
    /* The game's 320x200 pixels are meant to be shown at 4:3. */
    .stage { position: relative; width: min(100%, calc((100vh - 170px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    canvas:fullscreen { background: #000; object-fit: contain; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgb(0 0 0 / 0.8); cursor: pointer; text-align: center; padding: 16px; }
    #overlay[hidden] { display: none; }
    #message { font-size: 1.5rem; color: var(--accent); font-weight: 700; }
    #overlay small { color: var(--dim); max-width: 32em; }
    #overlay a { color: var(--fg); }
    #overlay code { color: var(--fg); }
    .button { margin-top: 8px; padding: 6px 14px; border: 1px solid var(--dim); border-radius: 4px; color: var(--fg); font-size: 0.9rem; cursor: pointer; }
    .button:hover { border-color: var(--fg); }
    #dropzone { position: absolute; inset: 8px; display: none; align-items: center; justify-content: center; border: 3px dashed var(--accent); border-radius: 8px; background: rgb(0 0 0 / 0.85); font-size: 1.5rem; font-weight: 700; pointer-events: none; }
    .stage.dragging #dropzone { display: flex; }
    dl.keys { display: grid; grid-template-columns: repeat(6, auto); gap: 2px 16px; margin: 0; color: var(--dim); font-size: 0.85rem; }
    dl.keys dt { color: var(--fg); text-align: right; }
    dl.keys dd { margin: 0; }
    .build { margin: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; color: var(--dim); font-size: 0.85rem; }
    .build button { font: inherit; color: var(--fg); background: none; padding: 2px 10px; border: 1px solid var(--dim); border-radius: 4px; cursor: pointer; }
    .build button:hover:not(:disabled) { border-color: var(--fg); }
    .build button:disabled { cursor: default; opacity: 0.6; }
    .build .note.attention { color: var(--accent); }
    @media (max-width: 800px) { dl.keys { grid-template-columns: repeat(4, auto); } }
    @media (max-width: 480px) { dl.keys { grid-template-columns: repeat(2, auto); } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="screen" width="320" height="200"></canvas>
    <div id="overlay">
      <div id="message">Loading…</div>
      <small id="hint"></small>
      <small id="getwad" hidden>No WAD yet? The shareware version is a free download:
        <a href="https://archive.org/download/DoomsharewareEpisode/DoomV1.9sw1995idSoftwareInc.action.zip" target="_blank" rel="noopener">DOOM v1.9 shareware (zip)</a>, with <code>DOOM1.WAD</code> inside.</small>
      <label id="chooser" class="button" hidden>Choose a .wad file
        <input id="file" type="file" accept=".wad" hidden>
      </label>
    </div>
    <div id="dropzone">Drop the WAD here</div>
  </div>
  <dl class="keys">
    <dt>Arrows</dt><dd>move, turn</dd>
    <dt>Ctrl</dt><dd>fire</dd>
    <dt>Space</dt><dd>open, use</dd>
    <dt>Shift</dt><dd>run</dd>
    <dt>Alt + arrows, , .</dt><dd>strafe</dd>
    <dt>1-7</dt><dd>weapon</dd>
    <dt>Tab</dt><dd>map</dd>
    <dt>Esc</dt><dd>menu</dd>
    <dt>F2 / F3</dt><dd>save / load</dd>
    <dt>Double click</dt><dd>full screen</dd>
  </dl>
  <p class="build">
    <span>Version <span id="version">…</span></span>
    <button id="update" type="button" title="Fetch the page and the game again, ignoring what the browser has kept">Update</button>
    <span id="note" class="note"></span>
  </p>
  <script type="module" src="main.js"></script>
</body>
</html>
